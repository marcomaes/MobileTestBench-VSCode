name: sync-check

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: extension
      - uses: actions/checkout@v7
        with:
          repository: marcomaes/MobileTestBench
          path: plugin
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check drift against the plugin
        working-directory: extension
        env:
          MTB_PLUGIN_DIR: ${{ github.workspace }}/plugin
        run: |
          node scripts/sync.mjs check
          node scripts/sync.mjs fixtures --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
